<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#0F1923">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="FinTrack">
<title>FinTrack — Personal Finance</title>
<link rel="manifest" href="manifest.json">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:ital,wght@0,300;0,400;0,500;1,300&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #0F1923;
  --surface: #162231;
  --surface2: #1D2E42;
  --surface3: #243550;
  --gold: #D4A843;
  --gold-light: #F0C96A;
  --teal: #2DD4BF;
  --red: #F87171;
  --green: #34D399;
  --blue: #60A5FA;
  --purple: #A78BFA;
  --orange: #FB923C;
  --text: #F1F5F9;
  --text2: #94A3B8;
  --text3: #64748B;
  --border: rgba(255,255,255,0.07);
  --radius: 18px;
  --radius-sm: 10px;
  --nav-h: 70px;
  --safe-bottom: env(safe-area-inset-bottom, 0px);
}

* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

body {
  font-family: 'DM Sans', sans-serif;
  background: var(--bg);
  color: var(--text);
  height: 100dvh;
  overflow: hidden;
  font-size: 15px;
}

/* ── PAGES ── */
.page {
  position: absolute; inset: 0;
  overflow-y: auto;
  padding-bottom: calc(var(--nav-h) + var(--safe-bottom) + 16px);
  display: none;
  scroll-behavior: smooth;
}
.page.active { display: block; animation: fadeUp 0.3s ease; }

@keyframes fadeUp {
  from { opacity:0; transform:translateY(12px); }
  to   { opacity:1; transform:translateY(0); }
}

/* ── TOP BAR ── */
.topbar {
  position: sticky; top: 0; z-index: 50;
  background: var(--bg);
  padding: 20px 20px 12px;
  border-bottom: 1px solid var(--border);
}
.topbar h1 {
  font-family: 'Syne', sans-serif;
  font-size: 22px; font-weight: 800;
  letter-spacing: -0.5px;
  color: var(--text);
}
.topbar .sub { font-size: 12px; color: var(--text3); margin-top: 2px; }
.topbar-row { display:flex; align-items:center; justify-content:space-between; }

/* ── NAV ── */
.nav {
  position: fixed; bottom: 0; left: 0; right: 0; z-index: 100;
  height: calc(var(--nav-h) + var(--safe-bottom));
  background: rgba(15, 25, 35, 0.95);
  backdrop-filter: blur(20px);
  border-top: 1px solid var(--border);
  display: flex; align-items: flex-start; padding-top: 8px;
}
.nav-btn {
  flex: 1; display: flex; flex-direction: column;
  align-items: center; gap: 4px; padding: 4px 0;
  background: none; border: none; cursor: pointer;
  color: var(--text3); transition: color 0.2s;
}
.nav-btn.active { color: var(--gold); }
.nav-btn svg { width: 22px; height: 22px; }
.nav-btn span { font-size: 10px; font-family: 'Syne', sans-serif; font-weight: 600; letter-spacing: 0.3px; }
.nav-btn.active .nav-icon-bg { background: rgba(212,168,67,0.12); border-radius: 8px; }

/* ── CARDS ── */
.card {
  background: var(--surface);
  border-radius: var(--radius);
  border: 1px solid var(--border);
  padding: 18px;
  margin: 0 16px 14px;
}
.card-sm { padding: 14px; margin-bottom: 10px; }
.card-title {
  font-family: 'Syne', sans-serif;
  font-size: 11px; font-weight: 700;
  letter-spacing: 1px; text-transform: uppercase;
  color: var(--text3); margin-bottom: 12px;
}

/* ── NET WORTH HERO ── */
.hero {
  margin: 16px 16px 14px;
  background: linear-gradient(135deg, #1D3A5C 0%, #162231 60%, #1A1F2E 100%);
  border-radius: var(--radius);
  border: 1px solid rgba(212,168,67,0.2);
  padding: 24px 20px;
  position: relative; overflow: hidden;
}
.hero::before {
  content: '';
  position: absolute; top: -40px; right: -40px;
  width: 160px; height: 160px;
  background: radial-gradient(circle, rgba(212,168,67,0.12) 0%, transparent 70%);
  border-radius: 50%;
}
.hero-label {
  font-size: 11px; font-weight: 500; letter-spacing: 1.5px;
  text-transform: uppercase; color: var(--gold); opacity: 0.8;
}
.hero-amount {
  font-family: 'Syne', sans-serif;
  font-size: 36px; font-weight: 800;
  color: var(--text); margin: 6px 0 4px;
  letter-spacing: -1px;
}
.hero-sub { font-size: 12px; color: var(--text3); }
.hero-row { display: flex; gap: 20px; margin-top: 20px; }
.hero-stat { flex: 1; }
.hero-stat .lbl { font-size: 10px; color: var(--text3); letter-spacing: 0.5px; text-transform: uppercase; }
.hero-stat .val { font-family: 'Syne', sans-serif; font-size: 16px; font-weight: 700; margin-top: 2px; }
.hero-stat .val.green { color: var(--green); }
.hero-stat .val.red { color: var(--red); }

/* ── SUMMARY CHIPS ── */
.chips { display: flex; gap: 10px; padding: 0 16px 14px; overflow-x: auto; scrollbar-width: none; }
.chips::-webkit-scrollbar { display: none; }
.chip {
  flex-shrink: 0;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 50px;
  padding: 8px 16px;
  display: flex; align-items: center; gap: 8px;
  cursor: pointer; transition: all 0.2s;
}
.chip:active { transform: scale(0.96); }
.chip .dot { width: 8px; height: 8px; border-radius: 50%; }
.chip .clbl { font-size: 11px; color: var(--text2); }
.chip .cval { font-family: 'Syne', sans-serif; font-size: 13px; font-weight: 700; }

/* ── ACCOUNT LIST ── */
.acct-item {
  display: flex; align-items: center;
  padding: 12px 0;
  border-bottom: 1px solid var(--border);
  cursor: pointer; transition: opacity 0.15s;
}
.acct-item:last-child { border-bottom: none; padding-bottom: 0; }
.acct-item:active { opacity: 0.7; }
.acct-icon {
  width: 40px; height: 40px; border-radius: 12px;
  display: flex; align-items: center; justify-content: center;
  font-size: 18px; flex-shrink: 0; margin-right: 12px;
}
.acct-info { flex: 1; min-width: 0; }
.acct-name { font-size: 14px; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.acct-type { font-size: 11px; color: var(--text3); margin-top: 2px; }
.acct-bal { text-align: right; flex-shrink: 0; }
.acct-bal .amount { font-family: 'Syne', sans-serif; font-size: 15px; font-weight: 700; }
.acct-bal .sub { font-size: 10px; color: var(--text3); margin-top: 1px; }
.status-dot { width: 6px; height: 6px; border-radius: 50%; display: inline-block; margin-right: 4px; }

/* ── SECTION HEADER ── */
.sec-hdr {
  display: flex; align-items: center; justify-content: space-between;
  padding: 0 16px; margin: 18px 0 10px;
}
.sec-hdr h2 { font-family: 'Syne', sans-serif; font-size: 14px; font-weight: 700; }
.sec-hdr a { font-size: 12px; color: var(--gold); text-decoration: none; }

/* ── PROGRESS BAR ── */
.prog-wrap { margin-top: 8px; }
.prog-bar { height: 6px; background: var(--surface3); border-radius: 99px; overflow: hidden; }
.prog-fill { height: 100%; border-radius: 99px; transition: width 0.6s ease; }
.prog-labels { display: flex; justify-content: space-between; margin-top: 4px; font-size: 10px; color: var(--text3); }

/* ── DUE SOON ── */
.due-item {
  display: flex; align-items: center;
  padding: 10px 0; border-bottom: 1px solid var(--border);
}
.due-item:last-child { border-bottom: none; }
.due-badge {
  padding: 3px 8px; border-radius: 6px;
  font-size: 10px; font-weight: 600;
  font-family: 'Syne', sans-serif;
  margin-right: 12px; flex-shrink: 0;
}
.due-badge.urgent { background: rgba(248,113,113,0.15); color: var(--red); }
.due-badge.soon   { background: rgba(251,146,60,0.15); color: var(--orange); }
.due-badge.ok     { background: rgba(52,211,153,0.15); color: var(--green); }

/* ── EXPENSE PAGE ── */
.month-selector {
  display: flex; align-items: center; gap: 12px;
  padding: 0 16px 14px;
}
.month-btn {
  background: var(--surface); border: 1px solid var(--border);
  border-radius: 8px; color: var(--text2);
  width: 32px; height: 32px; display: flex; align-items: center; justify-content: center;
  cursor: pointer; font-size: 16px;
}
.month-label { font-family: 'Syne', sans-serif; font-size: 15px; font-weight: 700; flex: 1; text-align: center; }
.exp-summary { display: flex; gap: 10px; padding: 0 16px 14px; }
.exp-stat { flex: 1; background: var(--surface); border-radius: var(--radius-sm); padding: 12px; border: 1px solid var(--border); }
.exp-stat .lbl { font-size: 10px; color: var(--text3); text-transform: uppercase; letter-spacing: 0.5px; }
.exp-stat .val { font-family: 'Syne', sans-serif; font-size: 17px; font-weight: 700; margin-top: 4px; }

.exp-list { padding: 0 16px; }
.exp-item {
  display: flex; align-items: center;
  background: var(--surface); border-radius: var(--radius-sm);
  padding: 12px 14px; margin-bottom: 8px;
  border: 1px solid var(--border);
  cursor: pointer; transition: all 0.15s;
  gap: 12px;
}
.exp-item:active { transform: scale(0.99); opacity: 0.85; }
.exp-cat-icon {
  width: 38px; height: 38px; border-radius: 10px;
  display: flex; align-items: center; justify-content: center;
  font-size: 17px; flex-shrink: 0;
}
.exp-info { flex: 1; min-width: 0; }
.exp-desc { font-size: 14px; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.exp-meta { font-size: 11px; color: var(--text3); margin-top: 2px; }
.exp-amount { font-family: 'Syne', sans-serif; font-size: 15px; font-weight: 700; color: var(--red); flex-shrink: 0; }
.exp-amount.transfer { color: var(--blue); }

/* ── FAB ── */
.fab {
  position: fixed; bottom: calc(var(--nav-h) + var(--safe-bottom) + 16px); right: 20px;
  width: 56px; height: 56px; border-radius: 50%;
  background: linear-gradient(135deg, var(--gold), var(--gold-light));
  border: none; cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  box-shadow: 0 8px 24px rgba(212,168,67,0.35);
  z-index: 90; transition: all 0.2s;
  color: #0F1923;
}
.fab:active { transform: scale(0.92); box-shadow: 0 4px 12px rgba(212,168,67,0.2); }
.fab svg { width: 26px; height: 26px; }

/* ── MODAL ── */
.modal-overlay {
  position: fixed; inset: 0; z-index: 200;
  background: rgba(0,0,0,0.65); backdrop-filter: blur(4px);
  display: none; align-items: flex-end;
}
.modal-overlay.open { display: flex; }
.modal {
  background: var(--surface);
  border-radius: 24px 24px 0 0;
  width: 100%; max-height: 90dvh;
  overflow-y: auto;
  padding: 0 20px calc(20px + var(--safe-bottom));
  animation: slideUp 0.35s cubic-bezier(0.16,1,0.3,1);
}
@keyframes slideUp {
  from { transform: translateY(100%); }
  to   { transform: translateY(0); }
}
.modal-handle {
  width: 36px; height: 4px; background: var(--text3);
  border-radius: 99px; margin: 12px auto 20px;
}
.modal-title {
  font-family: 'Syne', sans-serif; font-size: 18px; font-weight: 800;
  margin-bottom: 20px;
}

/* ── FORM ── */
.form-group { margin-bottom: 16px; }
.form-label { font-size: 11px; color: var(--text3); text-transform: uppercase; letter-spacing: 0.8px; margin-bottom: 6px; display: block; }
.form-input, .form-select {
  width: 100%; background: var(--surface2);
  border: 1px solid var(--border); border-radius: var(--radius-sm);
  color: var(--text); font-size: 15px; font-family: 'DM Sans', sans-serif;
  padding: 12px 14px; outline: none; transition: border-color 0.2s;
  appearance: none; -webkit-appearance: none;
}
.form-input:focus, .form-select:focus { border-color: var(--gold); }
.form-row { display: flex; gap: 12px; }
.form-row .form-group { flex: 1; }
.select-wrap { position: relative; }
.select-wrap::after {
  content: '▾'; position: absolute; right: 14px; top: 50%;
  transform: translateY(-50%); color: var(--text3); pointer-events: none;
}
.btn-primary {
  width: 100%; padding: 15px;
  background: linear-gradient(135deg, var(--gold), var(--gold-light));
  border: none; border-radius: var(--radius-sm);
  color: #0F1923; font-family: 'Syne', sans-serif;
  font-size: 15px; font-weight: 800; letter-spacing: 0.5px;
  cursor: pointer; margin-top: 8px; transition: all 0.2s;
}
.btn-primary:active { transform: scale(0.98); }
.btn-outline {
  width: 100%; padding: 13px;
  background: transparent; border: 1px solid var(--border);
  border-radius: var(--radius-sm); color: var(--text2);
  font-family: 'Syne', sans-serif; font-size: 14px; font-weight: 700;
  cursor: pointer; margin-top: 8px;
}

/* ── TRANSFERS PAGE ── */
.transfer-item {
  background: var(--surface); border-radius: var(--radius-sm);
  padding: 14px; margin: 0 16px 10px;
  border: 1px solid var(--border);
}
.transfer-flow { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; }
.transfer-acc {
  flex: 1; background: var(--surface2); border-radius: 8px;
  padding: 6px 10px; font-size: 12px; color: var(--text2);
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.transfer-arrow { color: var(--gold); font-size: 16px; flex-shrink: 0; }
.transfer-meta { display: flex; justify-content: space-between; align-items: center; }
.transfer-amount { font-family: 'Syne', sans-serif; font-size: 16px; font-weight: 700; color: var(--blue); }
.transfer-date { font-size: 11px; color: var(--text3); }

/* ── CATEGORY GRID ── */
.cat-grid { display: grid; grid-template-columns: repeat(3,1fr); gap: 10px; margin-bottom: 20px; }
.cat-btn {
  background: var(--surface2); border: 2px solid transparent;
  border-radius: var(--radius-sm); padding: 12px 6px;
  display: flex; flex-direction: column; align-items: center; gap: 6px;
  cursor: pointer; transition: all 0.15s;
}
.cat-btn.selected { border-color: var(--gold); background: rgba(212,168,67,0.08); }
.cat-btn .emoji { font-size: 22px; }
.cat-btn .name { font-size: 10px; color: var(--text2); font-weight: 500; }

/* ── ACCOUNTS PAGE ── */
.acct-section-label {
  padding: 16px 16px 8px;
  font-family: 'Syne', sans-serif; font-size: 11px; font-weight: 700;
  letter-spacing: 1.2px; text-transform: uppercase; color: var(--text3);
}
.acct-detail {
  background: var(--surface); border-radius: var(--radius);
  margin: 0 16px 10px; border: 1px solid var(--border); overflow: hidden;
}
.acct-detail-header {
  display: flex; align-items: center; padding: 16px;
  border-bottom: 1px solid var(--border);
}
.acct-detail-rows { padding: 4px 0; }
.acct-detail-row {
  display: flex; justify-content: space-between; align-items: center;
  padding: 10px 16px; font-size: 13px;
}
.acct-detail-row .k { color: var(--text3); }
.acct-detail-row .v { font-weight: 500; }
.acct-detail-row .v.red { color: var(--red); }
.acct-detail-row .v.green { color: var(--green); }
.acct-detail-row .v.orange { color: var(--orange); }
.util-bar { height: 4px; background: var(--surface3); border-radius: 99px; margin: 0 16px 12px; overflow: hidden; }
.util-fill { height: 100%; border-radius: 99px; }

/* ── SETTINGS PAGE ── */
.settings-group { margin: 0 16px 14px; background: var(--surface); border-radius: var(--radius); border: 1px solid var(--border); overflow: hidden; }
.settings-item {
  display: flex; align-items: center; padding: 14px 16px;
  border-bottom: 1px solid var(--border); cursor: pointer;
}
.settings-item:last-child { border-bottom: none; }
.settings-icon { width: 34px; height: 34px; border-radius: 9px; display: flex; align-items: center; justify-content: center; font-size: 16px; margin-right: 12px; flex-shrink: 0; }
.settings-info { flex: 1; }
.settings-info .k { font-size: 14px; font-weight: 500; }
.settings-info .v { font-size: 12px; color: var(--text3); margin-top: 1px; }
.settings-val { font-family: 'Syne', sans-serif; font-size: 14px; font-weight: 700; color: var(--gold); }
.toggle {
  width: 44px; height: 24px; background: var(--surface3);
  border-radius: 99px; position: relative; transition: background 0.2s; cursor: pointer;
}
.toggle.on { background: var(--gold); }
.toggle::after {
  content: ''; position: absolute; top: 2px; left: 2px;
  width: 20px; height: 20px; background: white; border-radius: 50%;
  transition: transform 0.2s;
}
.toggle.on::after { transform: translateX(20px); }

/* ── UTILITIES ── */
.divider { height: 1px; background: var(--border); margin: 4px 0; }
.tag { display: inline-block; padding: 2px 8px; border-radius: 5px; font-size: 10px; font-weight: 600; }
.tag.blue { background: rgba(96,165,250,0.15); color: var(--blue); }
.tag.gold { background: rgba(212,168,67,0.15); color: var(--gold); }
.tag.red  { background: rgba(248,113,113,0.15); color: var(--red); }
.tag.green{ background: rgba(52,211,153,0.15);  color: var(--green); }
.empty-state { text-align: center; padding: 40px 20px; color: var(--text3); font-size: 14px; }
.empty-state .icon { font-size: 40px; margin-bottom: 12px; }

/* scrollbar hide */
.page::-webkit-scrollbar, .modal::-webkit-scrollbar { display: none; }
.page { scrollbar-width: none; }

/* ── CATEGORY BUDGET BARS ── */
.budget-row { margin: 0 16px 8px; }
.budget-row-hdr { display: flex; justify-content: space-between; font-size: 12px; margin-bottom: 4px; }
.budget-row-hdr .bcat { color: var(--text2); }
.budget-row-hdr .bamt { font-family: 'Syne', sans-serif; font-weight: 600; }
</style>
</head>
<body>

<!-- ══════════════════════ DASHBOARD PAGE ══════════════════════ -->
<div class="page active" id="page-dashboard">
  <div class="topbar">
    <div class="topbar-row">
      <div>
        <h1>FinTrack 💼</h1>
        <div class="sub" id="dash-date">Loading...</div>
      </div>
      <div style="display:flex;gap:8px">
        <button onclick="showRateModal()" style="background:rgba(212,168,67,0.1);border:1px solid rgba(212,168,67,0.3);border-radius:8px;padding:6px 10px;color:var(--gold);font-size:11px;font-weight:700;cursor:pointer;">AED</button>
      </div>
    </div>
  </div>

  <!-- Net Worth Hero -->
  <div class="hero">
    <div class="hero-label">NET WORTH</div>
    <div class="hero-amount" id="dash-networth">₹0</div>
    <div class="hero-sub">Total assets minus all liabilities</div>
    <div class="hero-row">
      <div class="hero-stat">
        <div class="lbl">ASSETS</div>
        <div class="val green" id="dash-assets">₹0</div>
      </div>
      <div class="hero-stat">
        <div class="lbl">LIABILITIES</div>
        <div class="val red" id="dash-liabilities">₹0</div>
      </div>
      <div class="hero-stat">
        <div class="lbl">THIS MONTH</div>
        <div class="val" id="dash-month-spend" style="color:var(--orange)">₹0</div>
      </div>
    </div>
  </div>

  <!-- Quick chips -->
  <div class="chips" id="dash-chips"></div>

  <!-- Due Soon -->
  <div class="sec-hdr"><h2>⏰ Due Soon</h2></div>
  <div class="card">
    <div id="due-list"><div class="empty-state" style="padding:20px 0"><div class="icon">✅</div>No upcoming dues</div></div>
  </div>

  <!-- Indian Banks -->
  <div class="sec-hdr"><h2>🏦 Indian Banks</h2><a href="#" onclick="switchPage('accounts');return false">See all</a></div>
  <div class="card">
    <div id="dash-banks"></div>
  </div>

  <!-- Credit Cards -->
  <div class="sec-hdr"><h2>💳 Credit Cards</h2></div>
  <div class="card" id="dash-cc-card">
    <div id="dash-cc"></div>
  </div>

  <!-- UAE -->
  <div class="sec-hdr"><h2>🇦🇪 UAE Accounts</h2></div>
  <div class="card">
    <div id="dash-uae"></div>
  </div>

  <!-- Money Lent -->
  <div class="sec-hdr"><h2>🤝 Money Lent</h2><a href="#" onclick="switchPage('lent');return false">See all</a></div>
  <div class="card">
    <div id="dash-lent"></div>
  </div>
</div>

<!-- ══════════════════════ EXPENSES PAGE ══════════════════════ -->
<div class="page" id="page-expenses">
  <div class="topbar">
    <div class="topbar-row">
      <h1>Expenses</h1>
      <button onclick="openExpenseModal()" style="background:rgba(212,168,67,0.1);border:1px solid rgba(212,168,67,0.3);border-radius:8px;padding:7px 12px;color:var(--gold);font-size:13px;font-weight:700;cursor:pointer;">+ Add</button>
    </div>
  </div>

  <div class="month-selector">
    <button class="month-btn" onclick="changeMonth(-1)">‹</button>
    <div class="month-label" id="exp-month-label">May 2025</div>
    <button class="month-btn" onclick="changeMonth(1)">›</button>
  </div>

  <div class="exp-summary">
